model:
  default: kimi-k2.6
  provider: ollama-cloud
  base_url: https://ollama.com/v1
fallback_providers:
  # Cheap-first chain mirroring the global resilient chain (config.yaml).
  # The old chain was all-free (ollama weekly-limited + OpenRouter :free
  # variants that rate-limit/stall), leaving no terminal that completes.
- provider: ollama-cloud
  model: deepseek-v4-pro
  base_url: https://ollama.com/v1
- provider: nous
  model: qwen/qwen3.6-plus
  base_url: https://inference-api.nousresearch.com/v1
- provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b
  base_url: https://openrouter.ai/api/v1
providers:
  # ceecee loads this profile config (not global), so the stale-stream
  # watchdog default of 180s applies unless set here. The slow OpenRouter
  # and nous paths can legitimately prefill for minutes on a 40k context.
  openrouter:
    stale_timeout_seconds: 600
  nous:
    stale_timeout_seconds: 600
toolsets:
- hermes-cli
- kanban
- terminal
- file
agent:
  max_turns: 85
  reasoning_effort: low
kanban:
  dispatch_in_gateway: false
cron:
  ticker_enabled: false
discord:
  require_mention: true
  free_response_channels: '1506022640035303494'
  allowed_channels: ''
  auto_thread: true
  reactions: true
  channel_prompts: {}
  extra:
    allow_bots: mentions
    gateway_restart_notification: false
approvals:
  destructive_slash_confirm: false
skills:
  always_skills:
  - content-pipeline
  - postiz-self-hosting
  - avoid-ai-writing
  - social-content
  external_dirs:
  - /home/kensei/.hermes/skills
  enabled_skills:
  - avoid-ai-writing
  - content-pipeline
  - postiz-self-hosting
  - social-content
  enforcement_mode: shadow
tts:
  provider: kenseivoice
  voice: pocket:eve
